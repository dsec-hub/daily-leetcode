name: Docker Compose Deploy

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Create environment file
        working-directory: ${{ github.workspace }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is missing or empty."
            exit 1
          fi

          umask 077
          printf 'DISCORD_WEBHOOK_URL=%s\n' "$DISCORD_WEBHOOK_URL" > .env

      - name: Build and deploy
        working-directory: ${{ github.workspace }}
        run: |
          sudo docker compose up -d --build --force-recreate
          echo "Deployment complete."

      - name: Seed completed history
        working-directory: ${{ github.workspace }}
        run: |
          sudo docker compose exec -T leetcode-cron bun run scripts/add_history.ts --file completed-list.txt

      - name: Clean up old Docker images
        run: sudo docker image prune -f
